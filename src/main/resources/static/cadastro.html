<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Coretech</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div class="auth-page">
    <a href="/" class="auth-back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Voltar à loja
    </a>

    <div class="auth-card">
      <div class="auth-logo">
        Coretech
        <span class="logo-icon"></span>
      </div>
      <p class="auth-subtitle">Crie sua conta</p>

      <div class="auth-tabs">
        <a href="/login.html" class="auth-tab">Entrar</a>
        <a href="/cadastro.html" class="auth-tab active">Cadastrar</a>
      </div>

      <div class="auth-alert" id="authAlert"></div>

      <form id="cadastroForm">
        <div class="form-group">
          <label class="form-label" for="nome">Nome</label>
          <input type="text" id="nome" class="form-input" placeholder="Seu nome" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">E-mail</label>
          <input type="email" id="email" class="form-input" placeholder="seu@email.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="senha">Senha</label>
          <input type="password" id="senha" class="form-input" placeholder="Mínimo 6 caracteres" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmarSenha">Confirmar senha</label>
          <input type="password" id="confirmarSenha" class="form-input" placeholder="Repita sua senha" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Criar conta</button>
      </form>

      <!-- Etapa 2: confirmação do cadastro com o código de 6 números enviado por e-mail -->
      <div id="etapaCodigo" style="display:none;">
        <p class="auth-subtitle" style="margin-bottom:16px;">
          Enviamos um código de 6 números para <strong id="codigoEmail"></strong>.
          Digite o código para confirmar a criação da conta.
        </p>

        <form id="codigoForm">
          <div class="form-group">
            <label class="form-label" for="codigo">Código de confirmação</label>
            <input type="text" id="codigo" class="form-input" placeholder="000000" inputmode="numeric"
                   maxlength="6" pattern="[0-9]{6}" autocomplete="one-time-code"
                   style="text-align:center; letter-spacing:8px; font-size:1.3rem;" required>
          </div>

          <button type="submit" class="btn btn-primary btn-block">Confirmar código</button>
        </form>

        <p style="text-align:center; margin-top:14px; font-size:0.9rem;">
          Não recebeu o código?
          <a href="#" id="btnReenviarCodigo" style="color:var(--primary, #12b5d0); font-weight:600;">Reenviar código</a>
        </p>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
