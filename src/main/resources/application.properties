spring.application.name=sistemaCoreTech
spring.output.ansi.enabled=always 
spring.jpa.hibernate.ddl-auto=update
spring.profiles.active=prod


spring.config.import=optional:file:.env[.properties]



spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==== Upload de imagens de produtos (arquivo escolhido no PC pelo admin) ====
# As imagens salvas aqui sao servidas publicamente em /uploads/**
app.upload.diretorio=${APP_UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# JWT
app.jwt.secret=${APP_JWT_SECRET:coretech-sistema-secret-chave-secreta-para-assinatura-com-256bits!}

# PDF / E-mail
app.pdf.directory=${APP_PDF_DIRECTORY:./comprovantes}
# Afeta apenas o COMPROVANTE de compra: com "true" tenta enviar por e-mail e, se
# falhar, salva o PDF em disco. O CÓDIGO DE CONFIRMAÇÃO de cadastro ignora esta
# flag: ele é SEMPRE enviado por e-mail real (SMTP). Sem SMTP configurado o
# cadastro falha com mensagem clara, em vez de gerar código fictício.
app.email.habilitado=${APP_EMAIL_HABILITADO:true}

# ==== Administrador master (UNICO login com acesso ao painel/administracao) ====
# ATENCAO: o e-mail abaixo foi informado como "admin@gamil.com" (parece ser um erro de digitacao de "admin@gmail.com").
# Se preferir o dominio correto, altere a linha abaixo para: admin@gmail.com
app.admin.email=${APP_ADMIN_EMAIL:admin@gmail.com}
app.admin.senha=${APP_ADMIN_SENHA:admin123}
app.admin.nome=${APP_ADMIN_NOME:admin}

# ==== Confirmacao de cadastro do cliente por codigo de 6 numeros ====
app.verificacao.codigo-expiracao-minutos=${APP_CODIGO_EXPIRACAO_MINUTOS:15}


spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.default-encoding=UTF-8
# timeouts para o cadastro não "travar" quando o SMTP não responde
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECTION_TIMEOUT:8000}
spring.mail.properties.mail.smtp.timeout=${SMTP_TIMEOUT:8000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITETIMEOUT:8000}
